<nav class="nav" style="background-color: #dc3545;">
  <h1><a routerLink=""><img src="/assets/A&Dlogo.png" alt="image">A&D-KART</a> </h1>
 <div [ngSwitch]="menuType">
  <ul *ngSwitchCase="'default'" >
    <li><button><a routerLink="">Home</a></button></li>
    <li><button><a routerLink="user-auth">Login</a></button></li>
    <li><button><a [routerLink]="cartItems>0?'empty':'empty'">Cart({{cartItems}})</a></button></li>
  </ul>
  <ul *ngSwitchCase="'user'" >
    <li><button><a>Welcome {{userName | titlecase}}</a></button></li>
    <li><button><a (click)="userLogout()" >Logout</a></button></li>
    <li><button><a [routerLink]="cartItems>0?'cart-page':'empty'">Cart({{cartItems}})</a></button></li>
  </ul>
 </div>
</nav>
